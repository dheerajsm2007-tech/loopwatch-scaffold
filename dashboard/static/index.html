<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Loopwatch</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      --surface-1: #fcfcfb;
      --page-plane: #f9f9f7;
      --text-primary: #0b0b0b;
      --text-secondary: #52514e;
      --text-muted: #898781;
      --gridline: #e1e0d9;
      --baseline: #c3c2b7;
      --border: rgba(11,11,11,0.10);
      --series-spend: #2a78d6;
      --series-novelty: #eb6834;
      --status-good: #0ca30c;
      --status-good-bg: #e8f7e8;
      --status-critical: #d03b3b;
      --status-critical-bg: #fbeaea;
    }
    @media (prefers-color-scheme: dark) {
      :root:where(:not([data-theme="light"])) {
        color-scheme: dark;
        --surface-1: #1a1a19;
        --page-plane: #0d0d0d;
        --text-primary: #ffffff;
        --text-secondary: #c3c2b7;
        --text-muted: #898781;
        --gridline: #2c2c2a;
        --baseline: #383835;
        --border: rgba(255,255,255,0.10);
        --series-spend: #3987e5;
        --series-novelty: #d95926;
        --status-good: #0ca30c;
        --status-good-bg: #123312;
        --status-critical: #e66767;
        --status-critical-bg: #3a1414;
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --surface-1: #1a1a19;
      --page-plane: #0d0d0d;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #898781;
      --gridline: #2c2c2a;
      --baseline: #383835;
      --border: rgba(255,255,255,0.10);
      --series-spend: #3987e5;
      --series-novelty: #d95926;
      --status-good: #0ca30c;
      --status-good-bg: #123312;
      --status-critical: #e66767;
      --status-critical-bg: #3a1414;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--page-plane);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
    }
    .page {
      max-width: 1040px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.75rem;
      flex-wrap: wrap;
    }
    .brand { display: flex; align-items: center; gap: 0.6rem; }
    .brand-mark { width: 10px; height: 10px; border-radius: 50%; background: var(--series-spend); flex-shrink: 0; }
    h1 {
      font-size: 1.05rem; font-weight: 700; letter-spacing: 0.06em;
      text-transform: uppercase; margin: 0; color: var(--text-primary);
    }
    .controls { display: flex; align-items: center; gap: 0.6rem; }
    select, .theme-toggle {
      font: inherit; font-size: 0.85rem; color: var(--text-primary);
      background: var(--surface-1); border: 1px solid var(--border);
      border-radius: 8px; padding: 0.45rem 0.7rem; cursor: pointer;
    }
    .theme-toggle { padding: 0.45rem 0.55rem; line-height: 1; }

    .status-pill {
      display: inline-flex; align-items: center; gap: 0.35rem;
      font-size: 0.78rem; font-weight: 600; padding: 0.3rem 0.65rem;
      border-radius: 999px; background: var(--gridline); color: var(--text-secondary);
    }
    .status-pill.running { color: var(--status-good); background: var(--status-good-bg); }
    .status-pill.halted { color: var(--status-critical); background: var(--status-critical-bg); }
    .status-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

    #haltBanner {
      display: none; align-items: flex-start; gap: 0.75rem;
      margin-bottom: 1.5rem; padding: 0.9rem 1.1rem; border-radius: 10px;
      background: var(--status-critical-bg); border: 1px solid var(--status-critical);
    }
    #haltBanner.visible { display: flex; }
    #haltBanner svg { flex-shrink: 0; margin-top: 0.15rem; color: var(--status-critical); }
    #haltBanner .halt-title {
      font-weight: 700; font-size: 0.92rem; color: var(--status-critical);
      margin: 0 0 0.2rem; text-transform: uppercase; letter-spacing: 0.03em;
    }
    #haltBanner .halt-detail { color: var(--text-primary); font-size: 0.9rem; line-height: 1.45; margin: 0; }
    #haltBanner .halt-detail b { font-weight: 600; }

    .stats {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px;
      background: var(--border); border: 1px solid var(--border);
      border-radius: 12px; overflow: hidden; margin-bottom: 1.5rem;
    }
    .stat { background: var(--surface-1); padding: 1rem 1.2rem; }
    .stat .label {
      display: block; font-size: 0.72rem; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.35rem;
    }
    .stat .value { font-size: 1.6rem; font-weight: 600; font-variant-numeric: proportional-nums; }

    .chart-card {
      background: var(--surface-1); border: 1px solid var(--border);
      border-radius: 12px; padding: 1.25rem 1.25rem 0.75rem; margin-bottom: 1.25rem;
    }
    .chart-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem; }
    .chart-card h2 { font-size: 0.85rem; font-weight: 600; margin: 0; color: var(--text-secondary); }
    .table-toggle {
      font: inherit; font-size: 0.72rem; color: var(--text-muted); background: none;
      border: 1px solid var(--border); border-radius: 6px; padding: 0.25rem 0.55rem; cursor: pointer;
    }
    .table-toggle:hover { color: var(--text-primary); }
    .chart-wrap { height: 220px; }

    table.data-table { display: none; width: 100%; border-collapse: collapse; font-size: 0.8rem; margin-top: 0.5rem; }
    table.data-table.visible { display: table; }
    table.data-table th, table.data-table td {
      text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid var(--gridline);
      font-variant-numeric: tabular-nums;
    }
    table.data-table th { color: var(--text-muted); font-weight: 600; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.04em; }

    .empty-state { text-align: center; padding: 3rem 1rem; color: var(--text-muted); font-size: 0.9rem; }
    .empty-state code {
      background: var(--gridline); padding: 0.15rem 0.4rem; border-radius: 4px;
      font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 0.85em;
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="brand">
        <span class="brand-mark"></span>
        <h1>Loopwatch</h1>
      </div>
      <div class="controls">
        <span class="status-pill" id="statusPill"><span class="dot"></span><span id="statusText">idle</span></span>
        <select id="runSelect" aria-label="Select run"></select>
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">&#9680;</button>
      </div>
    </header>

    <div id="haltBanner" role="alert">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <div>
        <p class="halt-title">Halted &mdash; <span id="haltDetector"></span></p>
        <p class="halt-detail"><span id="haltReason"></span> <b>(step <span id="haltStep"></span>)</b></p>
      </div>
    </div>

    <div class="stats">
      <div class="stat"><span class="label">Steps</span><span class="value" id="stepCount">0</span></div>
      <div class="stat"><span class="label">Spend</span><span class="value" id="spend">$0.0000</span></div>
      <div class="stat"><span class="label">Runs traced</span><span class="value" id="runCount">0</span></div>
    </div>

    <div id="chartsRoot">
      <div class="chart-card">
        <div class="chart-card-header">
          <h2>Cumulative spend</h2>
          <button class="table-toggle" data-target="spendTable" type="button">View as table</button>
        </div>
        <div class="chart-wrap"><canvas id="spendChart"></canvas></div>
        <table class="data-table" id="spendTable">
          <thead><tr><th>Step</th><th>Tool</th><th>Cost ($)</th><th>Cumulative ($)</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>

      <div class="chart-card">
        <div class="chart-card-header">
          <h2>Progress signal (detector 4)</h2>
          <button class="table-toggle" data-target="noveltyTable" type="button">View as table</button>
        </div>
        <div class="chart-wrap"><canvas id="noveltyChart"></canvas></div>
        <table class="data-table" id="noveltyTable">
          <thead><tr><th>Step</th><th>Tool</th><th>Signal</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <div class="empty-state" id="emptyState" style="display:none;">No traces yet &mdash; run a real task through <code>run_agent()</code> or a demo script, and this page updates automatically (polls every second).</div>
  </div>

  <script>
    const themeToggle = document.getElementById('themeToggle');

    function currentTheme() {
      return document.documentElement.getAttribute('data-theme')
        || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    }

    (function applyStoredTheme() {
      const saved = localStorage.getItem('loopwatch-theme');
      if (saved) document.documentElement.setAttribute('data-theme', saved);
    })();

    function cssVar(name) {
      return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }

    Chart.defaults.font.family = "system-ui, -apple-system, 'Segoe UI', sans-serif";
    Chart.defaults.font.size = 11;

    function baseLineOptions(seriesLabel, valueFormatter) {
      return {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: cssVar('--surface-1'),
            titleColor: cssVar('--text-secondary'),
            bodyColor: cssVar('--text-primary'),
            borderColor: cssVar('--border'),
            borderWidth: 1,
            padding: 10,
            titleFont: { weight: '600' },
            callbacks: { label: (ctx) => `${seriesLabel}: ${valueFormatter(ctx.parsed.y)}` },
          },
        },
        scales: {
          x: {
            grid: { display: false },
            border: { color: cssVar('--baseline') },
            ticks: { color: cssVar('--text-muted') },
          },
          y: {
            beginAtZero: true,
            grid: { color: cssVar('--gridline') },
            border: { display: false },
            ticks: { color: cssVar('--text-muted') },
          },
        },
      };
    }

    const spendCtx = document.getElementById('spendChart').getContext('2d');
    const noveltyCtx = document.getElementById('noveltyChart').getContext('2d');

    const spendChart = new Chart(spendCtx, {
      type: 'line',
      data: { labels: [], datasets: [{
        data: [], borderColor: cssVar('--series-spend'), backgroundColor: cssVar('--series-spend') + '1a',
        borderWidth: 2, pointRadius: 0, pointHoverRadius: 4, pointHoverBackgroundColor: cssVar('--series-spend'),
        fill: true, tension: 0.25,
      }] },
      options: baseLineOptions('Spend', (v) => '$' + Number(v).toFixed(4)),
    });

    const noveltyOptions = baseLineOptions('Signal', (v) => (v ? 'new information' : 'repeat'));
    noveltyOptions.scales.y = {
      min: 0, max: 1,
      ticks: { stepSize: 1, color: cssVar('--text-muted'), callback: (v) => (v ? 'new' : 'repeat') },
      grid: { color: cssVar('--gridline') },
      border: { display: false },
    };

    const noveltyChart = new Chart(noveltyCtx, {
      type: 'line',
      data: { labels: [], datasets: [{
        data: [], borderColor: cssVar('--series-novelty'), backgroundColor: cssVar('--series-novelty') + '1a',
        borderWidth: 2, pointRadius: 3, pointHoverRadius: 5, pointBackgroundColor: cssVar('--series-novelty'),
        stepped: true, fill: true,
      }] },
      options: noveltyOptions,
    });

    function updateChartColors() {
      [[spendChart, '--series-spend'], [noveltyChart, '--series-novelty']].forEach(([chart, varName]) => {
        const color = cssVar(varName);
        chart.data.datasets[0].borderColor = color;
        chart.data.datasets[0].backgroundColor = color + '1a';
        chart.data.datasets[0].pointHoverBackgroundColor = color;
        chart.data.datasets[0].pointBackgroundColor = color;
        chart.options.plugins.tooltip.backgroundColor = cssVar('--surface-1');
        chart.options.plugins.tooltip.titleColor = cssVar('--text-secondary');
        chart.options.plugins.tooltip.bodyColor = cssVar('--text-primary');
        chart.options.plugins.tooltip.borderColor = cssVar('--border');
        chart.options.scales.x.ticks.color = cssVar('--text-muted');
        chart.options.scales.x.border.color = cssVar('--baseline');
        chart.options.scales.y.ticks.color = cssVar('--text-muted');
        chart.options.scales.y.grid.color = cssVar('--gridline');
        chart.update('none');
      });
    }

    themeToggle.addEventListener('click', () => {
      const next = currentTheme() === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('loopwatch-theme', next);
      updateChartColors();
    });

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      if (!localStorage.getItem('loopwatch-theme')) updateChartColors();
    });

    document.querySelectorAll('.table-toggle').forEach((btn) => {
      btn.addEventListener('click', () => {
        const table = document.getElementById(btn.dataset.target);
        const showing = table.classList.toggle('visible');
        btn.textContent = showing ? 'View as chart' : 'View as table';
      });
    });

    async function refreshRunList() {
      const runs = await fetch('/api/runs').then((r) => r.json());
      const select = document.getElementById('runSelect');
      const current = select.value;
      select.replaceChildren(...runs.map((r) => {
        const opt = document.createElement('option');
        opt.value = r;
        opt.textContent = r;
        return opt;
      }));
      if (runs.includes(current)) select.value = current;
      document.getElementById('runCount').textContent = runs.length;
      document.getElementById('emptyState').style.display = runs.length ? 'none' : 'block';
      document.getElementById('chartsRoot').style.display = runs.length ? '' : 'none';
      return runs.length > 0;
    }

    function renderHaltBanner(verdict) {
      const banner = document.getElementById('haltBanner');
      const statusPill = document.getElementById('statusPill');
      const statusText = document.getElementById('statusText');

      if (verdict && verdict.should_halt) {
        document.getElementById('haltDetector').textContent = verdict.detector;
        document.getElementById('haltReason').textContent = verdict.reason;
        document.getElementById('haltStep').textContent = verdict.halted_at_step;
        banner.classList.add('visible');
        statusPill.className = 'status-pill halted';
        statusText.textContent = 'halted';
      } else {
        banner.classList.remove('visible');
        statusPill.className = 'status-pill running';
        statusText.textContent = 'running';
      }
    }

    function fillTable(bodySelector, steps, columns) {
      const tbody = document.querySelector(bodySelector);
      tbody.replaceChildren(...steps.map((s) => {
        const tr = document.createElement('tr');
        columns.forEach((col) => {
          const td = document.createElement('td');
          td.textContent = col(s);
          tr.appendChild(td);
        });
        return tr;
      }));
    }

    async function refreshTrace() {
      const runId = document.getElementById('runSelect').value;
      if (!runId) return;
      const data = await fetch(`/api/trace/${encodeURIComponent(runId)}`).then((r) => r.json());

      document.getElementById('stepCount').textContent = data.steps.length;
      document.getElementById('spend').textContent = '$' + data.total_cost.toFixed(4);
      renderHaltBanner(data.verdict);

      let cumulative = 0;
      const labels = [];
      const spendPoints = [];
      const noveltyPoints = [];

      for (const step of data.steps) {
        cumulative += step.cost_usd;
        labels.push(step.step);
        spendPoints.push(Number(cumulative.toFixed(6)));
        noveltyPoints.push(step.novel ? 1 : 0);
      }

      spendChart.data.labels = labels;
      spendChart.data.datasets[0].data = spendPoints;
      spendChart.update('none');

      noveltyChart.data.labels = labels;
      noveltyChart.data.datasets[0].data = noveltyPoints;
      noveltyChart.update('none');

      let running = 0;
      fillTable('#spendTable tbody', data.steps, [
        (s) => s.step,
        (s) => s.tool,
        (s) => s.cost_usd.toFixed(4),
        (s) => (running += s.cost_usd).toFixed(4),
      ]);
      fillTable('#noveltyTable tbody', data.steps, [
        (s) => s.step,
        (s) => s.tool,
        (s) => (s.novel ? 'new' : 'repeat'),
      ]);
    }

    document.getElementById('runSelect').addEventListener('change', refreshTrace);

    async function tick() {
      const hasRuns = await refreshRunList();
      if (hasRuns) await refreshTrace();
    }
    setInterval(tick, 1000);
    tick();
  </script>
</body>
</html>
